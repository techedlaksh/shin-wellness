<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__ARCHIVE_TITLE__</title>
  <style>
    :root{color-scheme:light;--ink:#304d42;--paper:#f6f2e9;--line:#d9d9cb;--sage:#dfe6d8;--lilac:#ddd1ea;--muted:#64756e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,sans-serif}.shell{width:min(1500px,calc(100% - 40px));margin:auto;padding:42px 0 80px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:30px}h1{margin:0;font:52px/1.02 Georgia,serif;font-weight:400;letter-spacing:-.035em}header p{max-width:620px;margin:0;color:var(--muted)}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px)}button,a{font:inherit}.toolbar button,.toolbar a,.restore,.review-button{border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);padding:10px 15px;text-decoration:none;cursor:pointer}.toolbar a,.restore{background:var(--ink);color:white}.status{margin-left:auto;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.card{position:relative;border-top:1px solid var(--line);padding-top:12px}.card.best:before{content:'Highest score';position:absolute;z-index:2;top:22px;left:10px;padding:6px 9px;background:var(--lilac);border-radius:999px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}.preview{display:block;width:100%;height:360px;padding:0;border:0;overflow:hidden;background:white;cursor:zoom-in;box-shadow:0 14px 34px #52645a20}.preview img{display:block;width:100%;height:auto}.missing{display:grid;place-items:center;height:100%;padding:20px;color:var(--muted)}.meta{display:flex;align-items:center;justify-content:space-between;padding:12px 1px 10px}.meta div{display:grid}.meta span{font:10px ui-monospace,monospace;color:#819087}.meta b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--sage);font:20px Georgia,serif}.actions{display:grid;grid-template-columns:1.1fr .9fr;gap:7px}.restore,.review-button{width:100%}.restore{border:0}.restore:disabled{opacity:.45;cursor:wait}dialog{padding:0;border:0;box-shadow:0 30px 100px #0008}dialog::backdrop{background:#1a211dcc}.viewer{width:calc(100% - 28px);max-width:1540px;height:calc(100% - 28px);max-height:none;background:#252d29;color:var(--ink);overflow:hidden}.comparison{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(380px,.85fr);height:100%}.image-pane{overflow:auto;background:#252d29}.image-pane img{display:block;width:100%;height:auto}.critique{overflow-y:auto;border-left:1px solid var(--line);background:var(--paper);padding:48px 42px 60px}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-right:42px}.heading h2{margin:0;font:38px/1.05 Georgia,serif;font-weight:400}.score{display:grid;place-items:center;flex:0 0 56px;width:56px;height:56px;border-radius:50%;background:var(--sage);font:22px Georgia,serif}.copy{margin:30px 0 0;white-space:pre-wrap;font:15px/1.65 ui-sans-serif,system-ui,sans-serif;color:#435e53}.close{position:absolute;z-index:3;top:14px;right:14px;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:white;color:var(--ink);font-size:22px;cursor:pointer}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}header{align-items:start;flex-direction:column}.comparison{grid-template-columns:1fr;grid-template-rows:minmax(320px,52%) minmax(0,1fr)}.critique{border-top:1px solid var(--line);border-left:0;padding:34px 36px 48px}}@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.preview{height:300px}h1{font-size:40px}.status{width:100%;margin-left:0}.viewer{width:calc(100% - 16px);height:calc(100% - 16px)}.critique{padding:30px 24px 42px}.heading h2{font-size:30px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.preview{height:460px}.shell{width:calc(100% - 24px)}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header><h1 id="title"></h1><p id="summary"></p></header>
    <nav class="toolbar"><button data-restore="baseline">Return to baseline</button><button data-restore="winner">Use highest score</button><a id="download" download>Download manifest</a><span class="status" id="status">Ready</span></nav>
    <section class="grid" id="grid"></section>
  </main>
  <dialog class="viewer" id="viewer"><button class="close" aria-label="Close">×</button><div class="comparison"><div class="image-pane"><img alt=""></div><aside class="critique"><div class="heading"><h2></h2><span class="score"></span></div><div class="copy"></div></aside></div></dialog>
  <script>
    const archive=__ARCHIVE_DATA__;const grid=document.querySelector('#grid');const viewer=document.querySelector('#viewer');const status=document.querySelector('#status');
    document.querySelector('#title').textContent=archive.title;document.querySelector('#summary').textContent=`${archive.iterations.length} independently reviewed iteration${archive.iterations.length===1?'':'s'}. Open a screenshot to read the delivered critique beside it, or safely restore its exact source state.`;document.querySelector('#download').href='manifest.json';
    const pad=n=>String(n).padStart(3,'0');
    for(const item of archive.iterations){const card=document.createElement('article');card.className='card'+(archive.winner?.iteration===item.number?' best':'');const preview=item.screenshot?`<button class="preview" data-preview="${item.number}" aria-label="View iteration ${pad(item.number)}"><img src="${item.screenshot.replace(/^design-reviews\/[^/]+\//,'')}" alt="Full website at iteration ${pad(item.number)}" loading="lazy"></button>`:`<div class="preview"><span class="missing">Screenshot unavailable</span></div>`;card.innerHTML=`${preview}<div class="meta"><div><strong>Critic ${pad(item.number)}</strong><span>${item.sourceCommit?item.sourceCommit.slice(0,10):'source incomplete'}</span></div><b>${item.score==null?'—':Number(item.score).toFixed(1)}</b></div><div class="actions"><button class="restore" data-restore="${item.number}" ${item.sourceCommit?'':'disabled'}>Use this design</button><button class="review-button" data-preview="${item.number}">Read critique</button></div>`;grid.append(card)}
    function show(number){const item=archive.iterations.find(i=>i.number===Number(number));viewer.querySelector('img').src=item.screenshot?item.screenshot.replace(/^design-reviews\/[^/]+\//,''):'';viewer.querySelector('img').alt=`Full website at iteration ${pad(item.number)}`;viewer.querySelector('h2').textContent=`Critic ${pad(item.number)} analysis`;viewer.querySelector('.score').textContent=item.score==null?'—':Number(item.score).toFixed(1);viewer.querySelector('.copy').textContent=item.analysis||item.failure||'No delivered critique was preserved.';viewer.showModal()}
    document.querySelectorAll('[data-preview]').forEach(button=>button.addEventListener('click',()=>show(button.dataset.preview)));viewer.querySelector('.close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});
    async function restore(value){document.querySelectorAll('[data-restore]').forEach(item=>item.disabled=true);status.textContent='Restoring…';try{const response=await fetch('/api/restore',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({value})});const body=await response.json();if(!response.ok)throw new Error(body.error);status.textContent=body.message}catch(error){status.textContent=error.message;alert(error.message)}finally{document.querySelectorAll('[data-restore]').forEach(item=>item.disabled=false)}}document.querySelectorAll('[data-restore]').forEach(button=>button.addEventListener('click',()=>restore(button.dataset.restore)));
  </script>
</body>
</html>
